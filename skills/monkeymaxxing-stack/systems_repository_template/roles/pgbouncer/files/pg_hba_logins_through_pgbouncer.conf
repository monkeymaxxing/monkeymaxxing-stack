{{- /*
  The lines of pg_hba.conf that let each app's role log in to Postgres
  through PgBouncer, on a database server and on staging01:
  /etc/postgresql/pg_hba_logins_through_pgbouncer.conf, which the cluster's
  pg_hba.conf includes. It reads the role inputs apps and
  addresses_pgbouncer_logs_in_from. Two apps that share a database share its
  line.
*/ -}}
{{- $database_names := list -}}
{{- range $app_name, $app := .inputs.apps -}}{{- $database_names = append $database_names $app.database_name -}}{{- end -}}
{{- $database_names = uniq $database_names -}}
# Managed by MMX from roles/pgbouncer/files/pg_hba_logins_through_pgbouncer.conf
# in the systems repository. PgBouncer logs in to Postgres as each app's
# role, with its password, from where PgBouncer runs: the database servers'
# range of WireGuard addresses, or staging01's own address.
{{- range $database_names }}
host    {{ . }}   {{ . }}   {{ $.inputs.addresses_pgbouncer_logs_in_from }}   scram-sha-256
{{- end }}

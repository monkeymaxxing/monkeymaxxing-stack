{{- /*
  PgBouncer's settings on a database server, and on staging01:
  /etc/pgbouncer/pgbouncer.ini. It reads the role inputs apps and private_ip.
  Two apps that share a database share its entry.
*/ -}}
{{- $database_names := list -}}
{{- range $app_name, $app := .inputs.apps -}}{{- $database_names = append $database_names $app.database_name -}}{{- end -}}
{{- $database_names = uniq $database_names -}}
;; Managed by MMX from roles/pgbouncer/files/pgbouncer.ini in the systems repository.

[databases]
;; Each app's database, in this server's own Postgres, which listens only on
;; the WireGuard address. PgBouncer logs in as the client's role, with the
;; keys of the client's own login (SCRAM), so it holds no password.
{{- range $database_names }}
{{ . }} = host={{ $.inputs.private_ip }} port=5432 dbname={{ . }}
{{- end }}
;; Only for auth_query below: Postgres's own administrator, postgres, through
;; the local socket, where Postgres takes the account postgres that PgBouncer
;; runs as for it without a password (peer). Two connections are plenty for
;; the lookups.
pgbouncer_password_lookups = host=/var/run/postgresql port=5432 dbname=postgres pool_size=2

[pgbouncer]
listen_addr = {{ .inputs.private_ip }}
listen_port = 6432
;; The admin console, which end_connections_that_use_an_old_database_password uses: the account postgres reaches
;; it through this socket as the user pgbouncer, without a password.
unix_socket_dir = /var/run/postgresql

;; A Postgres connection is lent to a client for one transaction.
pool_mode = transaction
;; pgx, Ruby's pg, and psycopg prepare statements by name; PgBouncer prepares
;; each one again on the Postgres connection that runs it.
max_prepared_statements = 200

;; A client logs in with its role's password, which PgBouncer reads from
;; Postgres at each login. Only the apps' roles log in through PgBouncer.
auth_type = scram-sha-256
auth_user = postgres
auth_dbname = pgbouncer_password_lookups
auth_query = SELECT rolname, CASE WHEN rolvaliduntil < pg_catalog.now() THEN NULL ELSE rolpassword END FROM pg_catalog.pg_authid WHERE rolname = $1 AND rolcanlogin AND rolname IN ({{ range $index, $name := $database_names }}{{ if $index }}, {{ end }}'{{ $name }}'{{ end }})

;; Room for far more clients than the stack's largest pools open: dozens of
;; app servers, each with a few containers of tens of connections. They share
;; at most 20 Postgres connections per app's database on this server, about
;; as many transactions as a database server runs well at once, and fewer
;; when more apps share the server: the apps' databases share 54 of the
;; 100 connections Postgres allows (max_connections). MMWatchdog warns above
;; 70, and the system itself uses up to 15 at once: these 2 password
;; lookups, 5 MMWatchdog checks, 2 for pg_auto_failover, 2 for the nightly
;; backup, 3 for a person or the triage agent, and 1 for a deploy's
;; migration. 1 or 2 databases get 20 each, 3 get 18, 12 get 4.
{{- $pool_size := 20 }}{{ if $database_names }}{{ $pool_size = min 20 (div 54 (len $database_names)) }}{{ end }}
max_client_conn = 10000
default_pool_size = {{ $pool_size }}

;; A Postgres that starts up, as after a failover, refuses PgBouncer's login
;; for a moment: try again after a second, not after the default 15, during
;; which PgBouncer would refuse its clients.
server_login_retry = 1

# Server admission, with one inventory state for the button and ordinary runs.
inputs:
  apply_peer_changes: {type: boolean, default: false}
  # From work_out_who_this_server_talks_to, which leaves out every desk but
  # the kept one while everyone_locked_out_except_desk is set.
  wireguard_peer_names: {type: list, required: true}
  everyone_locked_out_except_desk: {type: string, default: ""}
  inventory_nodes: {type: mapping, required: true}
  wireguard_listen_port: {type: integer, required: true}   # the wg0 template reads it
  inventory_groups: {type: mapping, required: true}
  root_ssh_public_keys: {type: list, required: true}
  triage_ssh_public_key: {type: string, required: true}
  # true on util01 only. The triage agent runs on util01 and needs its model
  # provider there, so util01's triage user keeps its outgoing connections.
  is_util_server: {type: boolean, default: false}
node_tasks:
  - id: install_exactly_the_admitted_root_keys
    file:
      path: /root/.ssh/authorized_keys
      template: files/root_authorized_keys
      owner: root
      group: root
      permissions_mode: "0600"
  - id: apply_the_incident_peer_list
    when: "{{ .inputs.apply_peer_changes }}"
    wireguard_interface:
      name: wg0
      template: ../every_server/files/wireguard_wg0.conf
  - task_block:
      id: incident_ssh_admission
      changes:
        - id: write_the_incident_ssh_admission
          file:
            path: /etc/ssh/sshd_config.d/00-incident-lockout.conf
            template: files/sshd_lockout.conf
            owner: root
            group: root
            permissions_mode: "0644"
      validate:
        - id: check_ssh_admission
          shell: {script: sshd -t, dryrun: sshd -t, changed_when: false}
      activate:
        - id: reload_ssh_admission
          systemd_service: {name: ssh, state: running, refresh: reload}
  - id: create_the_triage_user
    when: {equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]}
    user:
      name: triage
      full_name: The triage agent on util01, read only
      supplementary_groups: [systemd-journal, adm]
      supplementary_groups_not_listed: remove
      shell: /bin/bash
      create_home_directory: true
      password_locked: true
  - id: lock_the_triage_user
    when: {not: {equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]}}
    user:
      name: triage
      supplementary_groups: []
      supplementary_groups_not_listed: remove
      shell: /usr/sbin/nologin
      create_home_directory: true
      password_locked: true
  # Root owns triage's home, .ssh directory and authorized_keys, and triage
  # cannot write any of them. The key's line carries restrict and from=:
  # a triage login that could rewrite the file, or rename .ssh and make its
  # own, would drop them. sshd's StrictModes accepts files owned by root.
  - id: make_the_triage_home_directory_root_owned
    directory: {path: /home/triage, owner: root, group: root, permissions_mode: "0755"}
  - id: create_the_triage_ssh_directory
    directory: {path: /home/triage/.ssh, owner: root, group: root, permissions_mode: "0755"}
  - id: install_exactly_the_admitted_triage_keys
    file:
      path: /home/triage/.ssh/authorized_keys
      template: files/triage_authorized_keys
      owner: root
      group: root
      permissions_mode: "0644"
  # The triage user on every server except util01 opens no new outgoing
  # connection, loopback aside. Reason: the key line's restrict blocks
  # tunnels and terminals, not an ordinary ssh app001 'curl ...', so a misled
  # triage agent could send data out from a server. Nothing runs as triage on
  # a server and needs the network: every sudo rule runs as root, and Postgres
  # is reached through the local socket. Replies on the triage user's own
  # incoming SSH login are established connections, which the rule leaves alone.
  - id: write_the_triage_user_no_new_outgoing_connections_table
    when:
      all:
        - {equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]}
        - {not: {equals: ["{{ .inputs.is_util_server }}", "true"]}}
    file:
      path: /etc/triage_user_no_new_outgoing_connections.nft
      content: |
        #!/usr/sbin/nft -f
        # Managed by MMX from roles/everyone_locked_out. Replace only our table, so loading this file again is safe.
        table inet stack_triage_user_no_new_outgoing_connections {}
        flush table inet stack_triage_user_no_new_outgoing_connections
        table inet stack_triage_user_no_new_outgoing_connections {
            chain output {
                type filter hook output priority filter; policy accept;
                meta skuid "triage" oifname != "lo" ct state new drop
            }
        }
      owner: root
      group: root
      permissions_mode: "0644"
      check_new_file:
        shell:
          script: nft --check --file "$NEW_FILE"
          dryrun: nft --check --file "$NEW_FILE"
          env: {NEW_FILE: "{{ .new_file.path }}"}
  - id: load_the_triage_user_table_at_every_boot
    when:
      all:
        - {equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]}
        - {not: {equals: ["{{ .inputs.is_util_server }}", "true"]}}
    systemd_unit:
      name: triage-user-no-new-outgoing-connections.service
      content: |
        # Managed by MMX from roles/everyone_locked_out.
        [Unit]
        Description=Drop new outgoing connections of the triage user
        After=network-pre.target
        Before=network.target

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/usr/sbin/nft -f /etc/triage_user_no_new_outgoing_connections.nft

        [Install]
        WantedBy=multi-user.target
  - id: run_the_triage_user_table
    when:
      all:
        - {equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]}
        - {not: {equals: ["{{ .inputs.is_util_server }}", "true"]}}
    systemd_service:
      name: triage-user-no-new-outgoing-connections.service
      state: running
      start_at_boot: true
      refresh: restart
  - id: restore_triage_read_only_commands
    when: {equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]}
    file:
      path: /etc/sudoers.d/triage-reads-only
      source: ../every_server/files/sudoers_triage
      owner: root
      group: root
      permissions_mode: "0440"
      check_new_file:
        shell:
          script: visudo -c -f "$NEW_FILE"
          dryrun: visudo -c -f "$NEW_FILE"
          env: {NEW_FILE: "{{ .new_file.path }}"}
  - id: remove_triage_read_only_commands
    when: {not: {equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]}}
    loop: [/etc/sudoers.d/triage-reads-only, /etc/sudoers.d/triage-reads-fleet-readings]
    as: sudoers_file
    file: {path: "{{ .sudoers_file }}", state: absent}
  - when: {path_exists: /etc/systemd/system/mmhotline-triage-agent-run.socket}
    task_block:
      id: triage_run_admission
      changes:
        - id: create_triage_unit_condition_directories
          loop: [mmhotline-triage-agent-run.socket, "mmhotline-triage-agent-run@.service"]
          as: unit
          directory: {path: "/etc/systemd/system/{{ .unit }}.d", owner: root, group: root, permissions_mode: "0755"}
        - id: retain_the_triage_lockout_across_service_restarts
          loop: [mmhotline-triage-agent-run.socket, "mmhotline-triage-agent-run@.service"]
          as: unit
          file:
            path: "/etc/systemd/system/{{ .unit }}.d/incident-lockout.conf"
            content: "[Unit]\nConditionPathExists=!/etc/mmhotline/everyone-locked-out\n"
            owner: root
            group: root
            permissions_mode: "0644"
      activate:
        - id: load_the_triage_run_conditions
          shell: {script: systemctl daemon-reload, dryrun: systemctl daemon-reload, changed_when: false}
  - id: retain_the_triage_lockout_after_reboot
    when:
      all:
        - path_exists: /etc/systemd/system/mmhotline-triage-agent-run.socket
        - not: {equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]}
    file:
      path: /etc/mmhotline/everyone-locked-out
      content: "The incident response disabled triage runs.\n"
      owner: root
      group: root
      permissions_mode: "0600"
  - id: remove_the_triage_lockout_on_undo
    when: {equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]}
    file: {path: /etc/mmhotline/everyone-locked-out, state: absent}
  - id: stop_new_triage_runs
    when:
      all:
        - path_exists: /etc/systemd/system/mmhotline-triage-agent-run.socket
        - not: {equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]}
    systemd_service: {name: mmhotline-triage-agent-run.socket, state: stopped, start_at_boot: true}
  - id: restore_new_triage_runs_on_undo
    when:
      all:
        - path_exists: /etc/systemd/system/mmhotline-triage-agent-run.socket
        - equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]
    systemd_service: {name: mmhotline-triage-agent-run.socket, state: running, start_at_boot: true}
  - id: install_session_termination
    file:
      path: /usr/local/sbin/end_untrusted_server_sessions
      source: files/end_untrusted_server_sessions
      owner: root
      group: root
      permissions_mode: "0700"
  - id: end_untrusted_server_sessions
    when: {not: {equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]}}
    shell:
      script: |
        if systemctl cat mmx-https-api.service >/dev/null 2>&1; then
          if systemctl is-active --quiet mmx-https-api.service; then
            systemctl kill --kill-whom=all --signal=KILL mmx-https-api.service
          fi
          systemctl stop mmx-https-api.service
        fi
        exec /usr/local/sbin/end_untrusted_server_sessions "$KEPT_ADDRESS"
      dryrun: printf '%s\n' 'would end SSH sessions outside the desk that keeps access, MMX HTTPS and triage processes'
      env:
        KEPT_ADDRESS: "{{ .inputs.inventory_nodes[.inputs.everyone_locked_out_except_desk].vars.private_ip }}"

  - id: restore_mmx_https_on_undo
    when:
      all:
        - equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]
        - path_exists: /etc/systemd/system/mmx-https-api.service
    systemd_service: {name: mmx-https-api, state: running, start_at_boot: true}

  - id: restore_the_triage_fleet_readings_on_util01
    when:
      all:
        - equals: ["{{ .node.name }}", util01]
        - equals: ["{{ .inputs.everyone_locked_out_except_desk }}", ""]
    file:
      path: /etc/sudoers.d/triage-reads-fleet-readings
      template: ../util_server/files/sudoers_triage_mmwatchdog_fleet_readings
      owner: root
      group: root
      permissions_mode: "0440"

{{- /*
  rclone's settings for the nightly copy of the apps' uploaded files
  (files/copy_uploads_to_the_backup_bucket) and for the restore drill's
  comparison of a sample file: /var/lib/mmhotline/uploads_backup_rclone.conf,
  owned by the mmhotline user, mode 0600. It reads the role inputs apps,
  backups, and the two remotes' keys.
*/ -}}
{{- range $app_name, $app := .inputs.apps }}
{{- if not (hasKey $app "production_uploads_r2_bucket") }}{{ fail (printf "apps.%s in mmx_project_settings.yml has no production_uploads_r2_bucket: add the R2 bucket of its uploaded files, or \"\" when it keeps none" $app_name) }}{{ end }}
{{- end -}}
# Managed by MMX from roles/uploads_backup/files/uploads_backup_rclone.conf in the
# systems repository. MMX hides this file's content in its output and results.

# The apps' upload buckets in R2, through R2's S3 API, with a token that can
# only read them, so no copy can change an upload, whatever it's told. The
# token reaches objects only, so rclone doesn't check the bucket itself.
[uploads_r2]
type = s3
provider = Cloudflare
region = auto
endpoint = {{ .inputs.backups.uploads_r2_s3_endpoint }}
access_key_id = {{ .inputs.uploads_r2_read_only_access_key_id }}
secret_access_key = {{ .inputs.uploads_r2_read_only_secret_access_key }}
no_check_bucket = true

# The uploads' B2 bucket, through B2's own API, whose b2_hide_file needs only
# the writeFiles capability, so the key has no deleteFiles: a file that
# leaves R2 is hidden here, never deleted, and its versions stay for the
# bucket's keep_prior_file_versions_in_buckets_for_days.
[uploads_backup]
type = b2
account = {{ .inputs.uploads_backup_b2_write_key_id }}
key = {{ .inputs.uploads_backup_b2_write_application_key }}
hard_delete = false

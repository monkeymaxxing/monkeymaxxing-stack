{{- /*
  The lockout numbers come from phone_code_lockout in
  mmx_project_settings.yml. Each must be a whole number of at least 1:
  fail2ban treats a ban time of 0 or less as no ban or a permanent ban, and
  0 failures as a ban on the first connection.
*/ -}}
{{- $lockout := .inputs.phone_code_lockout -}}
{{- $wrong_codes := $lockout.wrong_codes_before_lockout -}}
{{- $minutes := $lockout.lockout_minutes -}}
{{- /* A role input can arrive as a decimal number, so test the written number, not its Go type. */ -}}
{{- if not (regexMatch "^[1-9][0-9]*$" (toString $wrong_codes)) }}{{ fail (printf "phone_code_lockout.wrong_codes_before_lockout is %v. Use a whole number of at least 1, such as 5. Nothing changed." $wrong_codes) }}{{ end -}}
{{- if not (regexMatch "^[1-9][0-9]*$" (toString $minutes)) }}{{ fail (printf "phone_code_lockout.lockout_minutes is %v. Use a whole number of at least 1, such as 5. Nothing changed." $minutes) }}{{ end -}}
{{- if not (has $lockout.alert_severity_when_a_laptop_is_locked_out (list "info" "warn" "sos")) }}{{ fail (printf "phone_code_lockout.alert_severity_when_a_laptop_is_locked_out is %v. Use info, warn, or sos. Nothing changed." $lockout.alert_severity_when_a_laptop_is_locked_out) }}{{ end -}}
# Managed by MMX. One rule owns the ban timing, including rate-limit refusals.
[sshd]
enabled = false

[systems-desk-phone-code]
enabled = true
filter = systems-desk-phone-code
backend = systemd
journalmatch = _SYSTEMD_UNIT=ssh.service
maxretry = {{ int $wrong_codes }}
# 600 seconds: wrong codes count toward the lockout for ten minutes. The
# number is fixed because set-up-the-phone-code tells the person "within ten
# minutes", and wrong_codes_before_lockout and lockout_minutes already let a
# team make the lockout stricter or looser. Ten minutes is long enough that a
# guesser who waits out the 30-second phone-code rate limit between tries is
# still counted, and short enough that a person's own typos on separate days
# never add up.
findtime = 600
bantime = {{ mul (int $minutes) 60 }}
port = 22
banaction = nftables-multiport

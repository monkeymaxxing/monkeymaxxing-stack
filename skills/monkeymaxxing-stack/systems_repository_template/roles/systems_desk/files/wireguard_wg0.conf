{{- /*
  wg0 on a systems desk, in wg-quick's format. MMX adds the PrivateKey line.
  It reads the role inputs private_ip, wireguard_listen_port and allowed_laptops, and the content
  of /etc/systems-desk/wireguard-server-peers.conf, which only
  update-this-desks-wireguard-peers writes.

  One writer for each part: this desk review writes the interface and the
  laptop peers; update-this-desks-wireguard-peers sets the server peers from
  pushed main, with nothing from the person. This file copies the server
  peers below the line that update-this-desks-wireguard-peers looks for,
  because MMX makes the running wg0 match this file, and would otherwise
  remove the server peers at every desk review. PostUp loads the newest
  server peers when wg0 starts, such as after a reboot.
*/ -}}
# Managed by MMX from roles/systems_desk/files/wireguard_wg0.conf in the
# systems repository. The private key is in /etc/wireguard/wg0.private_key
# and is reused from first boot.
[Interface]
Address = {{ .inputs.private_ip }}/16
ListenPort = {{ .inputs.wireguard_listen_port }}
# Marks wg0's encrypted packets, which the desk firewall lets through for
# the coding agent's account (files/firewall.nft says why).
FwMark = 0x4d4d
PostUp = test ! -s /etc/systems-desk/wireguard-server-peers.conf || wg addconf %i /etc/systems-desk/wireguard-server-peers.conf
{{- range .inputs.allowed_laptops }}

[Peer]
# {{ .laptop_name }}
PublicKey = {{ .wireguard_public_key }}
AllowedIPs = {{ .private_ip }}/32
{{- end }}

# Server peers, copied from /etc/systems-desk/wireguard-server-peers.conf
{{ .node_tasks.read_this_desks_server_peers.content }}

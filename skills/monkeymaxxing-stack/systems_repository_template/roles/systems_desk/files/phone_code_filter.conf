[INCLUDES]
before = common.conf
[DEFAULT]
_daemon = sshd(?:-session)?
[Definition]
# The person and coding-agent: both log in from a laptop with the laptop key
# and the one phone code, so a guess as either one counts.
failregex = ^%(__prefix_line)serror: PAM: Authentication failure for (?:{{ .inputs.person_unix_username }}|coding-agent) from <HOST>\s*$
journalmatch = _SYSTEMD_UNIT=ssh.service

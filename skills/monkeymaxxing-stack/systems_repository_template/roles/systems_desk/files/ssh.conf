# The coding agent's Git SSH settings on this desk (coding-agent-gitconfig),
# for the main copy of the systems repository on util01. Installed by
# systems_desk. The production key signs in through the relay socket, and
# util01's host key is the one the systems repository committed in
# ssh/known_hosts, in the coding agent's checkout.
Host *
    IdentityAgent /run/desk-ssh-agent/socket
    IdentityFile /etc/systems-desk/production_key.pub
    IdentitiesOnly yes
    UserKnownHostsFile /home/coding-agent/systems_repository/ssh/known_hosts
    StrictHostKeyChecking yes
    ForwardAgent no

# Managed by MMX. Only the private door and loopback listen.
ListenAddress {{ .inputs.private_ip }}
ListenAddress 127.0.0.1
ListenAddress ::1
AuthenticationMethods publickey,keyboard-interactive
PubkeyAuthentication yes
KbdInteractiveAuthentication yes
PasswordAuthentication no
UsePAM yes
PermitRootLogin no
PerSourcePenalties no
# A command that sends and receives nothing for coding_agent_login_idle_minutes
# is closed, so one idle command, such as sleep, cannot keep the coding
# agent's login open past the idle limit; UnusedConnectionTimeout below then
# closes the connection. It stands here, for every login on this desk, the
# person's and root's included, because Debian 13's sshd applies
# ChannelTimeout from a Match block only before the login, not to its
# commands (seen with OpenSSH 10.0p2). "session:*" names every kind of
# session command; "session" alone stops matching once a command starts.
ChannelTimeout session:*={{ .inputs.coding_agent_login_idle_minutes }}m

Match Address 127.0.0.1,::1
    AuthenticationMethods publickey
    KbdInteractiveAuthentication no
    PermitRootLogin prohibit-password
    AllowUsers root
# From an allowed laptop: the person, and the coding agent on the laptop,
# each with the laptop key and the desk's one phone code (files/sshd_pam).
# Before the lock, root too (00-systems-desk-root-login-before-the-lock.conf).
Match Address *,!127.0.0.1,!::1
    AllowUsers {{ .inputs.person_unix_username }} coding-agent
# The coding agent's door. Its commands are not login shells, so sshd sets
# what Git and the production SSH need: the relay socket, which lets the
# production key sign in without handing out the key, and the coding agent's Git settings.
# No forwarding: the laptop gets no port, socket or agent of the desk's
# through this login. The desk ends a login unused for
# coding_agent_login_idle_minutes, whatever the laptop's settings say, and
# a timer ends it after coding_agent_login_longest_hours
# (roles/systems_desk/main.yml, end_the_coding_agents_long_logins).
Match User coding-agent
    DisableForwarding yes
    SetEnv SSH_AUTH_SOCK=/run/desk-ssh-agent/socket GIT_CONFIG_SYSTEM=/etc/systems-desk/coding-agent-gitconfig
    UnusedConnectionTimeout {{ .inputs.coding_agent_login_idle_minutes }}m
Match all

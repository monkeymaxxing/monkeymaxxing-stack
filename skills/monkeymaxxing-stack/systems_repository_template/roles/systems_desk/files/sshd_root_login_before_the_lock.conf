# Managed by MMX. Only before the lock: the bootstrap logs in as root from
# an allowed laptop's WireGuard address with the laptop key alone, which
# the provider put in root's authorized_keys. The playbook's lock stage
# deletes this file and that key. sshd reads this file before
# 00-systems-desk.conf, so this rule comes first for root; the Match block
# ends at the end of this file.
Match User root Address {{ .inputs.systems_desk_laptop_addresses }}
    AuthenticationMethods publickey
    KbdInteractiveAuthentication no
    PermitRootLogin prohibit-password
    AllowUsers root

{{- /*
  The lines of pg_hba.conf that let each app's role log in to its database,
  on a database server and on staging01:
  /etc/postgresql/pg_hba_logins_of_the_apps.conf, which the cluster's
  pg_hba.conf includes. The template reads the role inputs apps,
  app_server_addresses, private_ip, is_staging_server, and, on a database
  server, jobs_servers and jobs_server_addresses. Apps sharing a database
  share the database's lines.
*/ -}}
{{- $database_names := list -}}
{{- range $app_name, $app := .inputs.apps -}}{{- $database_names = append $database_names $app.database_name -}}{{- end -}}
{{- $database_names = uniq $database_names -}}
# Managed by MMX from roles/database_server/files/pg_hba_logins_of_the_apps.conf
# in the systems repository. Each app's role logs in to its own database,
# with its password, from where the app runs: the app servers' range of
# WireGuard addresses, or staging01's own address, because staging01's
# containers use the server's network.
{{- range $database_names }}
host    {{ . }}   {{ . }}   {{ $.inputs.app_server_addresses }}   scram-sha-256
{{- end }}
{{- if not .inputs.is_staging_server }}
# Secret rotation checks the current password on every database server.
# The local TCP connection uses the existing private listener, not peer login.
{{- range $database_names }}
host    {{ . }}   {{ . }}   {{ $.inputs.private_ip }}/32   scram-sha-256
{{- end }}
{{- end }}
{{- if and (not .inputs.is_staging_server) .inputs.jobs_servers }}
# While jobs_servers holds a server, also from the jobs servers' range,
# where the apps' job containers run.
{{- range $database_names }}
host    {{ . }}   {{ . }}   {{ $.inputs.jobs_server_addresses }}   scram-sha-256
{{- end }}
{{- end }}

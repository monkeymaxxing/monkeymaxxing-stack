{{- /*
  wg0, this server's interface on the WireGuard network, in wg-quick's
  format. MMX adds the PrivateKey line. It reads the role inputs
  inventory_nodes, wireguard_listen_port and wireguard_peer_names; and
  peers_with_the_database_moving_in and database_moving_in where the role
  has them.

  wireguard_peer_names comes from the role work_out_who_this_server_talks_to,
  which reads connections_between_server_pools in inventories/servers.yml:
  each server peers only with the servers its pool talks to, util01, and
  the systems desks. A systems desk has its own template,
  roles/systems_desk/files/wireguard_wg0.conf.

  A server and a desk reach each other on WireGuard's own port, not on the
  redirected UDP 443: files_used_by_several_roles/wireguard_notrack_between_servers_and_desks.nft
  says why. The old database that moves in is outside the Stack and keeps 443.
*/ -}}
# Managed by MMX from roles/every_server/files/wireguard_wg0.conf in the
# systems repository. The private key is in /etc/wireguard/wg0.private_key
# and is reused from first boot.
[Interface]
# The WireGuard network is the inventory's wireguard_network. It must not
# overlap a network this server already uses, such as a provider's private
# network on another network card: wg0 would take that network's traffic,
# its gateway's too.
Address = {{ (index .inputs.inventory_nodes .node.name).vars.private_ip }}/16
ListenPort = {{ .inputs.wireguard_listen_port }}
{{- range $peer_name := .inputs.wireguard_peer_names }}
{{- $peer := index $.inputs.inventory_nodes $peer_name }}

[Peer]
# {{ $peer_name }}
PublicKey = {{ $peer.vars.wireguard_public_key }}
Endpoint = {{ $peer.vars.public_ipv4_address }}:{{ $.inputs.wireguard_listen_port }}
AllowedIPs = {{ $peer.vars.private_ip }}/32
{{- end }}

{{- $moving := get .inputs "database_moving_in" | default dict }}
{{- if and $moving (get .inputs "peers_with_the_database_moving_in") }}

[Peer]
# The old database, only while its data moves into the Stack.
PublicKey = {{ $moving.wireguard_public_key }}
Endpoint = {{ $moving.public_ipv4_address }}:443
AllowedIPs = {{ $moving.wireguard_address }}/32
{{- end }}

# Managed by MMX. needrestart finds the services that still use an old
# library after an update.
{{- if .inputs.is_database_server }}
# A database server: list them only, so no update restarts PostgreSQL
# outside the team's window. update_database_servers restarts them there.
$nrconf{restart} = 'l';
{{- else }}
# Restart them at once, so a fixed library is in use the same day.
$nrconf{restart} = 'a';
{{- end }}
{{- if .inputs.is_util_server }}
# Except util01's jobs that run MMX: a restart would kill a run halfway,
# and a restore drill before it destroys restore01. Each job's next start
# uses the new libraries.
$nrconf{override_rc}{qr(^compare_every_server_with_the_repository\.service$)} = 0;
$nrconf{override_rc}{qr(^weekly_database_restore_drill\.service$)} = 0;
$nrconf{override_rc}{qr(^check_for_a_leftover_restore01\.service$)} = 0;
{{- end }}
{{- if .inputs.is_systems_desk }}
# Except the person's Rex sessions on a systems desk: a restart ends every
# terminal in them, with any MMX run started there, such as a desk review,
# a lock-out press or the coding agent's button, halfway. The person's next
# start of Rex, or the desk's next reboot, uses the new libraries.
$nrconf{override_rc}{qr(^rex-desk\.service$)} = 0;
{{- end }}
# This service waits for an ongoing unattended upgrade to finish. Restarting
# it from that upgrade's needrestart hook would wait for the hook itself.
$nrconf{override_rc}{qr(^unattended-upgrades\.service$)} = 0;
# The web containers, Caddy and cloudflared carry the requests, so no update
# restarts them: a restart while a server is the only one serving fails
# requests (about 4 seconds, measured on test servers). A web container's app uses the
# libraries in its image, so the restart would only refresh the host side
# (conmon). The next deploy, which restarts the containers, and the reboot
# after the update, which follows the reboot paths, pick up the new
# libraries. The jobs containers still restart: no request waits on them.
$nrconf{override_rc}{qr(^[a-z0-9_-]+-web-[0-9]+\.service$)} = 0;
$nrconf{override_rc}{qr(^caddy\.service$)} = 0;
$nrconf{override_rc}{qr(^cloudflared\.service$)} = 0;

// Managed by MMX. The distribution's 50unattended-upgrades chooses the
// release's security updates; on the servers outside the database pool,
// this file adds the vendors' apt repositories of Caddy, cloudflared,
// Claude Code, and Rex on systems desks.
// No server reboots by itself, so keep this "false": a surprise reboot
// costs more than most waiting fixes, which rarely reach these servers.
// Why, and when one can't wait: triage_agent_rules.md, "A fix that waits for a reboot".
Unattended-Upgrade::Automatic-Reboot "false";
// Remove the automatically installed packages that nothing needs any more.
Unattended-Upgrade::Remove-Unused-Dependencies "true";
{{- if .inputs.is_database_server }}
// A database server: an update of PostgreSQL, pg_auto_failover, or the
// kernel restarts the database, and an update of PgBouncer restarts it,
// which drops the apps' connections on the server, so the playbook
// update_database_servers installs those in the team's window, one server
// at a time. Each entry is the start of a package name.
Unattended-Upgrade::Package-Blacklist {
    "postgresql";
    "pg-auto-failover";
    "linux-";
    "pgbouncer";
};
{{- else }}
// The vendors' repositories, as their Release files name them (Origin and
// Codename), so Caddy, cloudflared, and Claude Code update themselves like
// the distribution's packages. apt adds these to the list in 50unattended-upgrades.
Unattended-Upgrade::Origins-Pattern {
    "origin=cloudsmith/caddy/stable,codename=any-version";
    "origin=cloudflared,codename=any";
    "origin=Anthropic,codename=stable";
{{- if .inputs.is_systems_desk }}
    "origin=Superlogical,codename=preview";
{{- end }}
};
{{- end }}

# The one step of a secret's rotation that util01's normal run can't do:
# after an app's database password changed, end the database connections
# that the old password opened. Every other kind of secret needs no playbook
# (operating_procedures/rotate_a_secret.md, "Rotating a secret").
#
#   ./server_management_scripts/run_mmx_on_util01 run end_connections_that_use_an_old_database_password --var environment_name=production --var database_name=shop
#
# A Postgres role has one password, and Postgres checks it only when a
# connection opens, so the old and the new password overlap in the
# connections, not in Postgres:
#   1. A person sets the new password in the vault, such as
#      mmx secrets add-random shop_database_password --replace (staging's
#      is staging_shop_database_password), commits, and pushes.
#   2. util01's every_server run sets the new database password on the
#      database primary first. Then every_server restarts the app's
#      containers with the new database password, one app server at a time.
#      Connections opened before Postgres's password changed stay open
#      meanwhile, so requests go on. Only new connections from an app server
#      whose containers have not restarted fail. The failures last seconds,
#      between the primary's password change and the app's container
#      restarts on the app server.
#   3. playbooks/end_connections_that_use_an_old_database_password.yml checks the current password with a
#      database login and every app secrets file against the current vault.
#      Then end_connections_that_use_an_old_database_password checks that every container of
#      the app restarted after the app's secrets file changed. Then
#      end_connections_that_use_an_old_database_password ends the app role's connections on each database server
#      in environment_name. Only connections opened before the oldest app
#      container started across all servers in environment_name end.
#      Connections opened before the oldest app container started used the
#      old password, for example a connection held by whoever leaked the old
#      password. The old password opens no new connections.
#
#      PgBouncer pools Postgres connections: apps connect to PgBouncer as
#      clients, and PgBouncer lends clients connections to Postgres.
#      Where PgBouncer runs, end_connections_that_use_an_old_database_password first ends the app role's client
#      connections to PgBouncer opened before the oldest app container
#      started across all servers in environment_name.
command_line_vars:
  environment_name:                         # production or staging
    type: string
  database_name:                            # the app's database_name in mmx_project_settings.yml, such as shop; its Postgres role has the same name
    type: string

fleet_stages:
  # Each environment has a separate stage so an empty staging group
  # needs no staging password. Live checks establish the prerequisite;
  # no private deployment-state file is read.
  - id: check_the_production_database_password
    nodes: database_servers
    skip_when_no_nodes_are_selected: true
    when: {equals: ["{{ .vars.environment_name }}", production]}
    on_node_failure: stop_run
    node_tasks:
      - role: verify_database_password_for_rotation
        inputs:
          database_name: "{{ .vars.database_name }}"
          database_server_address: "{{ .vars.private_ip }}"
          database_passwords:
            shop: "{{ .secrets.shop_database_password }}"
    outputs:
      # Add each app database to the role input and this output map.
      database_passwords:
        shop: "{{ .secrets.shop_database_password }}"

  - id: check_the_staging_database_password
    nodes: staging_server
    skip_when_no_nodes_are_selected: true
    when: {equals: ["{{ .vars.environment_name }}", staging]}
    on_node_failure: stop_run
    node_tasks:
      - role: verify_database_password_for_rotation
        inputs:
          database_name: "{{ .vars.database_name }}"
          database_server_address: "{{ .vars.private_ip }}"
          database_passwords:
            shop: "{{ .secrets.staging_shop_database_password }}"
    outputs:
      # Add each app database to the role input and this output map.
      database_passwords:
        shop: "{{ .secrets.staging_shop_database_password }}"

  # 2. The app's web and job containers are systemd services. Each container
  # must have started after the app's secrets file, /etc/<app>/<app>.env,
  # was last written. For production, end_connections_that_use_an_old_database_password checks containers on
  # the app servers and the jobs servers. For staging, end_connections_that_use_an_old_database_password checks
  # containers on staging01.
  #
  # MMX evaluates the when condition without connecting to a server.
  # A production password rotation skips staging01, and a staging
  # password rotation skips the production app and jobs servers.
  - id: find_when_the_containers_of_the_app_started
    nodes: [app_servers, jobs_servers, staging_server]
    when:
      any:
        - all:
            - {equals: ["{{ .vars.environment_name }}", production]}
            - any: ["{{ .vars.is_app_server }}", "{{ .vars.is_jobs_server }}"]
        - all:
            - {equals: ["{{ .vars.environment_name }}", staging]}
            - "{{ .vars.is_staging_server }}"
    on_node_failure: stop_run
    node_tasks:
      - id: read_the_start_times_of_the_containers
        shell:
          # The same read-only program runs in a run and in a dryrun.
          script: python3 -I -c "$PROGRAM"
          dryrun: python3 -I -c "$PROGRAM"
          env:
            PROGRAM: |
              import json, os, subprocess, sys

              def run(*command):
                  return subprocess.run(command, capture_output=True, text=True, check=True).stdout

              apps = [name for name, app in json.loads(os.environ["APPS"]).items() if app["database_name"] == os.environ["DATABASE_NAME"]]
              if not apps:
                  sys.exit(f"no app in mmx_project_settings.yml has the database_name {os.environ['DATABASE_NAME']}")
              databases = json.loads(os.environ["DATABASE_PASSWORDS"])[os.environ["ENVIRONMENT_NAME"]]
              password = next(iter(databases.values()))["database_passwords"][os.environ["DATABASE_NAME"]]
              start_times = []
              for app in apps:
                  with open(f"/etc/{app}/{app}.env") as secrets_file:
                      expected = f"DATABASE_URL=postgresql://{os.environ['DATABASE_NAME']}:{password}@"
                      if not any(line.startswith(expected) for line in secrets_file):
                          sys.exit(f"{app}'s secrets file does not hold the current database password; run every_server first")
                  # systemd gives a start time in whole seconds, and a container that
                  # restarted in the second its secrets file was written started after it.
                  secrets_file_changed_at = int(os.stat(f"/etc/{app}/{app}.env").st_mtime)
                  units = run("systemctl", "list-units", "--type=service", "--state=running", "--no-legend", "--plain",
                              f"{app}-web-*.service", f"{app}-jobs.service").split()
                  units = [unit for unit in units if unit.endswith(".service")]
                  if not units:
                      sys.exit(f"no container of {app} runs here")
                  for unit in units:
                      started_at = int(run("systemctl", "show", "--property=ActiveEnterTimestamp", "--value",
                                           "--timestamp=unix", unit).strip().lstrip("@"))
                      if started_at < secrets_file_changed_at:
                          sys.exit(f"{unit} started before /etc/{app}/{app}.env changed: every_server hasn't restarted it with the new password yet")
                      start_times.append(started_at)
              print(json.dumps({"oldest_container_started_at": min(start_times)}))
            APPS: "{{ .vars.apps }}"
            DATABASE_NAME: "{{ .vars.database_name }}"
            ENVIRONMENT_NAME: "{{ .vars.environment_name }}"
            DATABASE_PASSWORDS:
              production: "{{ .outputs.check_the_production_database_password }}"
              staging: "{{ .outputs.check_the_staging_database_password }}"
          output_holds_no_secret: true
          changed_when: false
    outputs:
      oldest_container_started_at: "{{ .node_tasks.read_the_start_times_of_the_containers.stdout_json.oldest_container_started_at }}"

  # 3. The connection-ending stage runs on replicas too, because apps that
  # read from replicas opened connections to replicas with the old password.
  # The connection-ending stage reads the whole output of step 2, which
  # holds only servers in environment_name. A server that failed step 2
  # stopped the run at step 2.
  - id: end_the_connections_of_the_old_password
    nodes: [database_servers, staging_server]
    when:
      any:
        - all:
            - {equals: ["{{ .vars.environment_name }}", production]}
            - "{{ .vars.is_database_server }}"
        - all:
            - {equals: ["{{ .vars.environment_name }}", staging]}
            - "{{ .vars.is_staging_server }}"
    node_tasks:
      # The task below ends PgBouncer clients before Postgres connections
      # end. PgBouncer keeps clients logged in after the clients' password
      # changes and gives clients new Postgres connections, so the order
      # matters. The task ends only clients of the app's role connected
      # before the cutoff.
      # The cutoff is the oldest app container's start time across all
      # servers in environment_name, from step 2.
      #
      # The task runs only if /etc/pgbouncer/pgbouncer.ini exists, so the
      # task runs wherever PgBouncer is installed by roles/pgbouncer, also
      # after pgbouncer_runs_in_front_of_postgres was set back to false.
      # PgBouncer's admin console accepts the Linux account postgres on
      # the local socket, using the database login pgbouncer. PgBouncer
      # gives each client's connect_time in the server's local time, such
      # as "2026-11-03 14:01:00 UTC".
      - id: end_the_pgbouncer_clients_older_than_the_oldest_container
        shell:
          # One program: a run ends the old clients, a dryrun only counts them.
          script: python3 -I -c "$PROGRAM" end_the_clients
          dryrun: python3 -I -c "$PROGRAM" only_count_the_clients
          run_as_user_account: postgres
          run_only_if_this_path_exists: /etc/pgbouncer/pgbouncer.ini
          env:
            PROGRAM: |
              import csv, io, json, os, subprocess, sys, time

              cutoff = min(server["oldest_container_started_at"] for server in json.loads(os.environ["CONTAINER_START_TIMES"]).values())

              def pgbouncer(command):
                  return subprocess.run(["psql", "-X", "--csv", "-h", "/var/run/postgresql", "-p", "6432", "-U", "pgbouncer",
                                         "-d", "pgbouncer", "-c", command], capture_output=True, text=True, check=True).stdout

              old_clients = [row["id"] for row in csv.DictReader(io.StringIO(pgbouncer("SHOW CLIENTS")))
                             if row["user"] == os.environ["DATABASE_NAME"]
                             and time.mktime(time.strptime(row["connect_time"][:19], "%Y-%m-%d %H:%M:%S")) < cutoff]
              if sys.argv[1] == "end_the_clients":
                  for client_id in old_clients:
                      pgbouncer(f"KILL_CLIENT {client_id}")
              print(len(old_clients))
            DATABASE_NAME: "{{ .vars.database_name }}"
            CONTAINER_START_TIMES: "{{ .outputs.find_when_the_containers_of_the_app_started }}"
          # The number of PgBouncer clients the task ended.
          changed_when: {number_greater_than: ["{{ .this_node_task.stdout }}", 0]}
      - id: end_the_connections_older_than_the_oldest_container
        shell:
          script: |
            cutoff=$(python3 -I -c 'import json, os; print(min(server["oldest_container_started_at"] for server in json.loads(os.environ["CONTAINER_START_TIMES"]).values()))') || exit 1
            psql -X -q -At -v ON_ERROR_STOP=1 -d postgres -v role="$DATABASE_NAME" -v cutoff="$cutoff" <<'SQL'
            select count(pg_terminate_backend(pid)) from pg_stat_activity
            where usename = :'role' and backend_start < to_timestamp(:cutoff);
            SQL
          dryrun: |
            cutoff=$(python3 -I -c 'import json, os; print(min(server["oldest_container_started_at"] for server in json.loads(os.environ["CONTAINER_START_TIMES"]).values()))') || exit 1
            psql -X -q -At -v ON_ERROR_STOP=1 -d postgres -v role="$DATABASE_NAME" -v cutoff="$cutoff" <<'SQL'
            select count(*) from pg_stat_activity
            where usename = :'role' and backend_start < to_timestamp(:cutoff);
            SQL
          run_as_user_account: postgres
          env:
            DATABASE_NAME: "{{ .vars.database_name }}"
            CONTAINER_START_TIMES: "{{ .outputs.find_when_the_containers_of_the_app_started }}"
          # The number of Postgres connections the task ended.
          changed_when: {number_greater_than: ["{{ .this_node_task.stdout }}", 0]}

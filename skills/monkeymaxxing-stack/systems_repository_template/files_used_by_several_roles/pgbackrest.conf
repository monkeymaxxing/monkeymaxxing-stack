{{- /*
  pgBackRest's settings, /etc/pgbackrest/pgbackrest.conf, owned by root and
  readable by the group postgres, on every server that backs Postgres up or
  restores it: the database servers, with the key that writes to
  production's bucket (roles/database_server), and the server
  that restores production, with the key that can only read
  (playbooks/restore_database.yml). One template for all of them, so a
  restore reads the repository exactly where and as the backups wrote it:
  the same bucket path, address style, and cipher.

  It reads the mapping pgbackrest_settings, which the caller sets with
  set_vars just before: b2_s3_endpoint, b2_region, bucket_name,
  bucket_key_id, bucket_application_key, repository_cipher_passphrase,
  data_directory, the cluster's data directory, and the three backup
  lengths of vars.backups: keep_database_backups_for_days,
  lock_backups_against_deletion_for_days, and
  keep_prior_file_versions_in_buckets_for_days.

  The lengths are checked here, on every server that writes this file, so
  a value below its minimum stops the run before anything changes. A role
  input can arrive as a decimal number, so each test reads the written number.
*/ -}}
{{- $keep := .vars.pgbackrest_settings.keep_database_backups_for_days -}}
{{- $lock := .vars.pgbackrest_settings.lock_backups_against_deletion_for_days -}}
{{- $prior := .vars.pgbackrest_settings.keep_prior_file_versions_in_buckets_for_days -}}
{{- if not (regexMatch "^[0-9]+$" (toString $keep)) }}{{ fail (printf "backups.keep_database_backups_for_days is %v. Use a whole number of days, 14 or more, such as 21. Nothing changed." $keep) }}{{ end -}}
{{- if lt (int $keep) 14 }}{{ fail (printf "backups.keep_database_backups_for_days is %v, below the minimum of 14. A full backup runs every week, and the weekly restore drill needs the previous full backup still present. Nothing changed." $keep) }}{{ end -}}
{{- if not (regexMatch "^[0-9]+$" (toString $lock)) }}{{ fail (printf "backups.lock_backups_against_deletion_for_days is %v. Use a whole number of days from 8 up to keep_database_backups_for_days, such as 14. Nothing changed." $lock) }}{{ end -}}
{{- if lt (int $lock) 8 }}{{ fail (printf "backups.lock_backups_against_deletion_for_days is %v, below the minimum of 8. The uploads job makes a full copy every 6 days and warns at 8 days, so a shorter lock could end before the next full copy protects an unchanged file. Nothing changed." $lock) }}{{ end -}}
{{- if gt (int $lock) (int $keep) }}{{ fail (printf "backups.lock_backups_against_deletion_for_days is %v, more than backups.keep_database_backups_for_days (%v). pgBackRest would try to delete backups that are still locked. Lower the lock or raise keep_database_backups_for_days. Nothing changed." $lock $keep) }}{{ end -}}
{{- if not (regexMatch "^[1-9][0-9]*$" (toString $prior)) }}{{ fail (printf "backups.keep_prior_file_versions_in_buckets_for_days is %v. Use a whole number of days of at least 1, such as 14. Nothing changed." $prior) }}{{ end -}}
# Managed by MMX from files_used_by_several_roles/pgbackrest.conf in the systems repository. MMX
# hides this file's content in its output and results.
[global]
# The only repository: the B2 bucket, through B2's S3-compatible API. Its
# versions and its Object Lock keep every file for
# backups.lock_backups_against_deletion_for_days (14 in the template), even
# after pgBackRest or an attacker deletes it.
repo1-type=s3
repo1-s3-endpoint={{ .vars.pgbackrest_settings.b2_s3_endpoint }}
repo1-s3-region={{ .vars.pgbackrest_settings.b2_region }}
repo1-s3-bucket={{ .vars.pgbackrest_settings.bucket_name }}
# B2 answers each bucket at its own host name, BUCKET.ENDPOINT; a B2 bucket's
# name holds no dot, so B2's certificate matches that name.
repo1-s3-uri-style=host
repo1-s3-key={{ .vars.pgbackrest_settings.bucket_key_id }}
repo1-s3-key-secret={{ .vars.pgbackrest_settings.bucket_application_key }}
repo1-path=/pgbackrest
# pgBackRest encrypts every file before it leaves the server: the bucket's
# lock protects the backups from being deleted, not from being read by
# whoever takes over the B2 account.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass={{ .vars.pgbackrest_settings.repository_cipher_passphrase }}
# Full backups are kept for backups.keep_database_backups_for_days (21 in
# the template), each with its daily differential backups and the
# write-ahead log after it, so a restore reaches any moment of that period.
# A full backup runs every weekly_work_day, and pgBackRest deletes a full backup
# after the period ends. The minimum is 14 days: the weekly restore drill
# needs the previous full backup still present. The lock cannot be longer
# than this period (see the checks at the top of this file).
repo1-retention-full-type=time
repo1-retention-full={{ int $keep }}
# Backups and restores copy four files at a time. Each file waits for the
# bucket's answer, so one at a time is slow to a far-away bucket: a 30 MB
# first backup from Germany to B2's US West took 8.6 minutes, and 2.7 with
# four. The write-ahead log still goes one file at a time.
process-max=4

# The stanza main: the cluster in its data directory. Postgres answers on its
# local socket, at port 5432.
[main]
pg1-path={{ .vars.pgbackrest_settings.data_directory }}
pg1-port=5432

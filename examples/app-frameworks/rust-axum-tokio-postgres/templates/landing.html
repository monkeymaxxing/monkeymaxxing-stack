<!doctype html><html lang="en"><meta charset="utf-8"><title>Customer portal</title>
<h1>Customer portal</h1><p>Keep private records and documents, and request a record-count report.</p>
<h2>Log in</h2><form method="post" action="/login"><label>Email <input name="email" type="email" required autocomplete="username"></label><label>Password <input name="password" type="password" minlength="12" maxlength="72" required autocomplete="current-password"></label><button>Log in</button></form>
<h2>Create an account</h2><form method="post" action="/register"><label>Email <input name="email" type="email" required autocomplete="username"></label><label>Password (12 to 72 bytes) <input name="password" type="password" minlength="12" maxlength="72" required autocomplete="new-password"></label><button>Create account</button></form></html>

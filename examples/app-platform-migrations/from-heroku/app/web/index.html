<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer portal</title><link rel="stylesheet" href="/style.css"><script src="/portal.js" defer></script></head>
<body><main>
<h1>Customer portal</h1><p>Keep your invoice records and private documents, and request a record-count report.</p>
<p id="notice" role="status" aria-live="polite"></p>
<section id="account"><h2>Sign in or create an account</h2>
<form id="credentials"><label>Email <input name="email" type="email" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" minlength="12" required></label><button name="action" value="login">Sign in</button><button name="action" value="register">Create account</button></form></section>
<section id="portal" hidden><h2 id="identity"></h2><button id="logout">Sign out</button>
<h2>Your invoice records</h2><form id="record"><label>Title <input name="title" maxlength="500" required></label><button>Create record</button></form><ul id="records"></ul>
<h2>Your private documents</h2><form id="upload"><label>Document <input name="file" type="file" required></label><button>Upload private document</button></form><ul id="documents"></ul>
<h2>Your reports</h2><button id="report">Queue record-count report</button><button id="refresh">Refresh reports</button><ul id="reports"></ul>
</section></main></body></html>

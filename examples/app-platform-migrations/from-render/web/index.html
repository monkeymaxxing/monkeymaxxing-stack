<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Customer portal</title><link rel="stylesheet" href="/style.css"><main><h1>Customer portal</h1><p>Keep your invoice records and private documents together. Queue a report to count your records.</p><p id="message" role="status"></p><section id="auth"><h2>Your account</h2><label>Email <input id="email" type="email" autocomplete="username"></label><label>Password <input id="password" type="password" autocomplete="current-password"></label><button id="register">Register</button><button id="login">Log in</button></section><section id="portal" hidden><p id="identity"></p><button id="logout">Log out</button><h2>Your records</h2><form id="record-form"><label>Title <input id="title" required></label><label>Description <input id="description"></label><button>Create record</button></form><ul id="records"></ul><h2>Your private documents</h2><input type="file" id="document"><button id="upload">Upload document</button><ul id="documents"></ul><h2>Your reports</h2><button id="queue">Queue record-count report</button><ul id="jobs"></ul><h2>Scheduled task</h2><p id="schedule"></p></section></main><script src="/portal.js"></script></html>

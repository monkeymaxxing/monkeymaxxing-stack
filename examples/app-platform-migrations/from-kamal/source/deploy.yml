service: migration-portal
image: example/migration-portal
minimum_version: 2.12.0
servers:
  web:
    hosts: [<%= ENV.fetch("KAMAL_SOURCE_HOST") %>]
    cmd: "sh -c 'bin/portal migrate && exec bin/portal web'"
  worker:
    hosts: [<%= ENV.fetch("KAMAL_SOURCE_HOST") %>]
    cmd: "sh -c 'bin/portal migrate && exec bin/portal jobs'"
  clock:
    hosts: [<%= ENV.fetch("KAMAL_SOURCE_HOST") %>]
    cmd: "sh -c 'bin/portal migrate && exec bin/portal clock'"
proxy:
  ssl: false
  host: portal.example.com
  app_port: 3000
  healthcheck:
    path: /healthz
registry:
  server: 127.0.0.1:5555
  # Public placeholders: this isolated loopback registry does not authenticate.
  username: fixture
  password: fixture
builder:
  arch: amd64
  context: .
  dockerfile: Containerfile
asset_path: /app/public/assets
env:
  clear:
    RAILS_ENV: production
    PORT: 3000
    WEB_CONCURRENCY: 1
    DATABASE_POOL_MAX_CONNECTIONS: 4
    APP_ORIGIN: https://portal.example.com
    R2_ENDPOINT: <%= ENV.fetch("SOURCE_STORAGE_ENDPOINT") %>
    R2_BUCKET: source-uploads
  secret:
    - DATABASE_URL
    - SECRET_KEY_BASE
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
accessories:
  postgres:
    image: postgres:17.11
    host: <%= ENV.fetch("KAMAL_SOURCE_HOST") %>
    port: <%= ENV.fetch("SOURCE_DATABASE_BIND") %>:5432:5432
    env:
      clear:
        POSTGRES_DB: portal
        POSTGRES_USER: portal
      secret:
        - POSTGRES_PASSWORD
    directories:
      - postgres-data:/var/lib/postgresql/data
    cmd: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4 -c wal_sender_timeout=4s

# Copy to playbooks/portal_session_cleanup.yml in the systems repository.
# The Stack app is shop, with the fixture's portal database.
fleet_stages:
  - id: configure_portal_session_cleanup
    nodes: app_servers
    node_tasks:
      - id: remove_expired_portal_sessions_hourly
        systemd_scheduled_job:
          name: portal_session_cleanup
          cron_schedule: "0 * * * *"
          run_missed_job_after_downtime: true
          stop_a_run_after: 55m  # A stuck run must end before the next hourly occurrence.
          run_as_user_account: root
          run_from_directory: /
          env:
            APP_IMAGE: "{{ .vars.apps.shop.image }}:{{ .vars.deployed_image_tags.production.shop }}"
          script: >-
            exec podman run --rm --network host
            --env-file /etc/shop/shop_settings.env --env-file /etc/shop/shop.env
            "$APP_IMAGE"
            schedule.mjs

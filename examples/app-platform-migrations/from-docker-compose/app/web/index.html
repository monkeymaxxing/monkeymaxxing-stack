<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer portal</title><link rel="stylesheet" href="/style.css"><script src="/portal.js" defer></script></head><body><main><h1>Customer portal</h1><p>Keep private records and documents, and request a report of your record count.</p><p id="status" role="status"></p><section><h2>Account</h2><form id="account"><label>Email <input name="email" type="email" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required minlength="12"></label><button name="action" value="register">Register</button><button name="action" value="login">Log in</button></form><button id="logout">Log out</button><p id="identity"></p></section><section><h2>Your records</h2><form id="record"><label>Title <input name="title" required></label><button>Add record</button></form><ul id="records"></ul></section><section><h2>Your private documents</h2><form id="upload"><label>Document <input type="file" name="document" required></label><button>Upload document</button></form><ul id="documents"></ul></section><section><h2>Your record-count reports</h2><button id="queue">Queue report</button><ul id="reports"></ul></section></main></body></html>

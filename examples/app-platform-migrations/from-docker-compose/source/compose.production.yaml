services:
  postgres:
    restart: unless-stopped
    ports:
      - ${SOURCE_DATABASE_WIREGUARD_IP:?set SOURCE_DATABASE_WIREGUARD_IP}:5432:5432
  web:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEPLOYMENT_LABEL: production-override
  worker:
    restart: unless-stopped
    environment:
      NODE_ENV: production

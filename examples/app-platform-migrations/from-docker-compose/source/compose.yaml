name: container-migration
x-app: &app
  image: compose-portal:rehearsal
  build:
    context: ../app
    dockerfile: Containerfile
  environment: &app-env
    DATABASE_URL_FILE: /run/secrets/database_url
    COOKIE_SECURE: "false"
    UPLOADS_DIR: /uploads
    PORT: "8080"
    WEB_CONCURRENCY: "1"
  secrets: [database_url]
  volumes:
    - ${SOURCE_UPLOADS_DIR:?set SOURCE_UPLOADS_DIR}:/uploads
services:
  postgres:
    image: ${SOURCE_POSTGRES_IMAGE:-postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994}
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: portal
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The 8 GiB retained-WAL cap leaves room for data and backups on this fixture's 40 GiB disk.
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=8, -c, max_wal_senders=8, -c, max_slot_wal_keep_size=8GB, -c, wal_sender_timeout=4s]
    ports:
      - 127.0.0.1:15432:5432
  web:
    <<: *app
    ports: [127.0.0.1:18001:8080]
    command: [server.mjs]
  worker:
    <<: *app
    command: [jobs.mjs]
secrets:
  database_url:
    file: ${SOURCE_SECRETS_DIR:?set SOURCE_SECRETS_DIR}/database_url
  postgres_password:
    file: ${SOURCE_SECRETS_DIR:?set SOURCE_SECRETS_DIR}/postgres_password
volumes:
  postgres_data:

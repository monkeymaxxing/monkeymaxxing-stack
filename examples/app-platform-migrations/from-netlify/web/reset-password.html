<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Set your portal password</title></head><body>
<main><h1>Set your portal password</h1><p>Your account and documents moved from Netlify. Set a new password to use your account on the Stack.</p>
<p id="message" role="status"></p>
<form id="request"><label>Email <input name="email" type="email" required autocomplete="username"></label><button>Send a password-reset link</button></form>
<form id="complete" hidden><label>New password <input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>Confirm password <input name="confirmation" type="password" minlength="12" required autocomplete="new-password"></label><button>Set password</button></form>
<p><a href="/">Log in to your account</a></p></main><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token');history.replaceState(null,'',location.pathname);const message=document.getElementById('message');
if(token){document.getElementById('request').hidden=true;document.getElementById('complete').hidden=false;}
async function send(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error);message.textContent=data.message;}
document.getElementById('request').onsubmit=async event=>{event.preventDefault();try{await send('/api/auth/password-reset/request',{email:new FormData(event.target).get('email')});}catch(error){message.textContent=error.message;}};
document.getElementById('complete').onsubmit=async event=>{event.preventDefault();const form=new FormData(event.target);try{await send('/api/auth/password-reset/complete',{token,password:form.get('password'),password_confirmation:form.get('confirmation')});event.target.reset();event.target.hidden=true;}catch(error){message.textContent=error.message;}};
</script></body></html>
